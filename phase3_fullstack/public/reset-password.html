<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Finance — Новый пароль</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-dark: #0B1220; --navy: #16213E; --blue: #2D6CDF; --blue-light: #EAF1FE;
    --bg-page: #F3F5F9; --card: #FFFFFF; --text: #12172A;
    --text-soft: #626B85; --border: #E4E8F0; --red: #D33F3F; --green: #1F9254;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif; background: var(--navy-dark);
    background-image: linear-gradient(120deg, var(--navy-dark) 55%, var(--navy) 100%);
  }
  .box {
    background: var(--card); border-radius: 14px; padding: 40px 36px;
    width: 100%; max-width: 380px; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5);
  }
  .brand { font-weight: 800; font-size: 20px; color: var(--navy); margin-bottom: 4px; }
  .brand span { color: var(--blue); }
  .sub { font-size: 12px; color: var(--text-soft); font-family: 'IBM Plex Mono', monospace; margin-bottom: 24px; }
  label { display: block; font-size: 12.5px; color: var(--text-soft); font-weight: 500; margin-bottom: 6px; margin-top: 16px; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%; padding: 11px 13px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif;
  }
  .pw-field { position: relative; }
  .pw-field input { padding-right: 84px; }
  .pw-toggle {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    margin: 0; padding: 6px 12px; font-size: 11.5px; font-weight: 600; width: auto;
    background: var(--blue-light); color: var(--blue); border: none; border-radius: 6px; cursor: pointer;
  }
  button[type=submit] {
    width: 100%; padding: 12px; border: none; border-radius: 8px; margin-top: 22px;
    background: var(--blue); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .msg { font-size: 13px; margin-top: 14px; text-align: center; min-height: 18px; }
  .msg.ok { color: var(--green); }
  .msg.err { color: var(--red); }
  .back-link { display: block; text-align: center; margin-top: 18px; font-size: 12.5px; color: var(--text-soft); text-decoration: none; border-bottom: 1px dotted var(--text-soft); }
</style>
</head>
<body>
  <form class="box" id="resetForm">
    <div class="brand">AI <span>Finance</span></div>
    <div class="sub">введите код и новый пароль</div>

    <label>Логин</label>
    <input type="text" id="username" required autocomplete="username">

    <label>Код из письма/Telegram (6 цифр)</label>
    <input type="text" id="code" required maxlength="6" pattern="\d{6}" placeholder="123456">

    <label>Новый пароль (минимум 6 символов)</label>
    <div class="pw-field">
      <input type="password" id="newPassword" required minlength="6">
      <button type="button" class="pw-toggle" onclick="togglePw('newPassword', this)">Показать</button>
    </div>

    <label>Повторите новый пароль</label>
    <div class="pw-field">
      <input type="password" id="confirmPassword" required minlength="6">
      <button type="button" class="pw-toggle" onclick="togglePw('confirmPassword', this)">Показать</button>
    </div>

    <button type="submit">Сохранить новый пароль</button>
    <div class="msg" id="msg"></div>
    <a class="back-link" href="/login.html">← Вернуться ко входу</a>
  </form>

<script>
  function togglePw(id, btn) {
    const input = document.getElementById(id);
    if (input.type === 'password') { input.type = 'text'; btn.textContent = 'Скрыть'; }
    else { input.type = 'password'; btn.textContent = 'Показать'; }
  }

  const params = new URLSearchParams(location.search);
  if (params.get('username')) document.getElementById('username').value = params.get('username');

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msgEl = document.getElementById('msg');
    msgEl.textContent = ''; msgEl.className = 'msg';

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if (newPassword !== confirmPassword) {
      msgEl.textContent = 'Пароли не совпадают'; msgEl.className = 'msg err'; return;
    }

    try {
      const res = await fetch('/api/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          code: document.getElementById('code').value.trim(),
          newPassword
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Ошибка');
      msgEl.textContent = '✓ Пароль изменён, сейчас перенаправим ко входу...'; msgEl.className = 'msg ok';
      setTimeout(() => { window.location.href = '/login.html'; }, 1500);
    } catch (err) {
      msgEl.textContent = err.message; msgEl.className = 'msg err';
    }
  });
</script>
</body>
</html>
