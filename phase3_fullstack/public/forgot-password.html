<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Finance — Восстановление пароля</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-dark: #0B1220; --navy: #16213E; --blue: #2D6CDF;
    --bg-page: #F3F5F9; --card: #FFFFFF; --text: #12172A;
    --text-soft: #626B85; --border: #E4E8F0; --red: #D33F3F; --green: #1F9254;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif; background: var(--navy-dark);
    background-image: linear-gradient(120deg, var(--navy-dark) 55%, var(--navy) 100%);
  }
  .box {
    background: var(--card); border-radius: 14px; padding: 40px 36px;
    width: 100%; max-width: 380px; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5);
  }
  .brand { font-weight: 800; font-size: 20px; color: var(--navy); margin-bottom: 4px; }
  .brand span { color: var(--blue); }
  .sub { font-size: 12px; color: var(--text-soft); font-family: 'IBM Plex Mono', monospace; margin-bottom: 24px; }
  label { display: block; font-size: 12.5px; color: var(--text-soft); font-weight: 500; margin-bottom: 6px; margin-top: 16px; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%; padding: 11px 13px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif;
  }
  .channel-row { display: flex; gap: 14px; margin-top: 6px; }
  .channel-row label { display: flex; align-items: center; gap: 6px; font-weight: 500; margin: 0; cursor: pointer; }
  .channel-row input { width: auto; }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 8px; margin-top: 22px;
    background: var(--blue); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .msg { font-size: 13px; margin-top: 14px; text-align: center; min-height: 18px; }
  .msg.ok { color: var(--green); }
  .msg.err { color: var(--red); }
  .back-link { display: block; text-align: center; margin-top: 18px; font-size: 12.5px; color: var(--text-soft); text-decoration: none; border-bottom: 1px dotted var(--text-soft); }
</style>
</head>
<body>
  <form class="box" id="forgotForm">
    <div class="brand">AI <span>Finance</span></div>
    <div class="sub">восстановление пароля</div>

    <label>Логин</label>
    <input type="text" id="username" required autocomplete="username">

    <label>Куда отправить код</label>
    <div class="channel-row">
      <label><input type="radio" name="channel" value="email" checked> Email</label>
      <label><input type="radio" name="channel" value="telegram"> Telegram</label>
    </div>

    <button type="submit">Отправить код</button>
    <div class="msg" id="msg"></div>
    <a class="back-link" href="/login.html">← Вернуться ко входу</a>
  </form>

<script>
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msgEl = document.getElementById('msg');
    msgEl.textContent = ''; msgEl.className = 'msg';
    const username = document.getElementById('username').value.trim();
    const channel = document.querySelector('input[name=channel]:checked').value;

    try {
      const res = await fetch('/api/forgot-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, channel })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Ошибка запроса');
      msgEl.textContent = data.message; msgEl.className = 'msg ok';
      setTimeout(() => {
        window.location.href = '/reset-password.html?username=' + encodeURIComponent(username);
      }, 1500);
    } catch (err) {
      msgEl.textContent = err.message; msgEl.className = 'msg err';
    }
  });
</script>
</body>
</html>
